<style>

.container {

    padding: 34px 26px 28px;

h1 {

.question {

}


/* =========================
   MESSAGE
========================= */

.message {
    padding: 8px 4px 12px;

    font-size: 17px;

    color: #5b515b;

    text-align: left;

    white-space: pre-line;

/* =========================
   OPTIONS
========================= */

.option-list {
    display: flex;

    flex-direction: column;

    gap: 11px;

}


.option {

    transition:
        transform 0.2s ease,

        box-shadow 0.2s ease;

    box-shadow:

}


.option:hover {

    border-color: #e0b8cc;

    background: #fff8fb;

    box-shadow:
        0 8px 18px rgba(150, 90, 125, 0.09);
}


.option:has(input:checked) {
    border-color: #d79ab7;

    background: #fff2f7;

    box-shadow:
        0 7px 18px rgba(190, 120, 150, 0.10);
}


.option input {
    width: 18px;
    height: 18px;

    flex: 0 0 auto;

    accent-color: #c982a5;
}


/* =========================
   BUTTON AREA
========================= */

.buttons {
    position: relative;

    min-height: 55px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 13px;
}


/* =========================
   ALL BUTTONS
========================= */

button {
    border: none;

    border-radius: 14px;

    padding: 14px 25px;

    font-family: inherit;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease;
}


button:hover {
    transform: translateY(-2px);
}


button:active {
    transform: scale(0.96);
}


/* =========================
   YES BUTTON
========================= */

#yesBtn {
    color: white;

    background:
        linear-gradient(
            135deg,
            #c77b9f,
            #ad6c91
        );

    box-shadow:
        0 8px 20px rgba(174, 103, 143, 0.25);
}


#yesBtn:hover {
    filter: brightness(1.05);

    box-shadow:
        0 11px 24px rgba(174, 103, 143, 0.3);
}


/* =========================
   NO BUTTON
========================= */

#noBtn {
    color: #665b64;

    background: #f3edf1;

    box-shadow:
        0 5px 15px rgba(80, 60, 75, 0.07);
}


/* =========================
   NEXT BUTTON
========================= */

.nextBtn {
    width: 100%;

    margin-top: 20px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #b8799a,
            #8f718e
        );

    box-shadow:
        0 9px 22px rgba(130, 91, 119, 0.2);
}


.nextBtn:hover {
    filter: brightness(1.05);
}


/* =========================
   TEXTAREA
========================= */

textarea {
    width: 100%;

    min-height: 135px;

    padding: 15px 16px;

    border: 1px solid #e5d9e1;

    border-radius: 15px;

    resize: vertical;

    font-family: inherit;

    font-size: 16px;

    line-height: 1.55;

    color: #493f48;

    background: rgba(255, 255, 255, 0.78);

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}


textarea::placeholder {
    color: #aaa0aa;
}


textarea:focus {
    border-color: #cf94b0;

    background: white;

    box-shadow:
        0 0 0 4px rgba(207, 148, 176, 0.12);
}


/* =========================
   PROGRESS
========================= */

.progress {
    margin-top: 22px;

    color: #a296a1;

    font-size: 13px;

    font-weight: 600;
}


/* =========================
   SMALL TEXT
========================= */

.small {
    margin-top: 9px;

    color: #aaa1aa;

    font-size: 13px;
}


/* =========================
   ERROR
========================= */

.error {
    margin-top: 10px;

    color: #c65f70;

}


/* =========================
   FINAL SCREEN
========================= */

.final {
    font-size: 17px;

}


.final h2 {
    margin-top: 0;

    color: #594452;
}


/* =========================
   HIDDEN
========================= */

.hidden {
    display: none !important;
}


/* =========================
   MOBILE

@media (max-width: 480px) {

    body {
        padding: 14px;
    }

        padding: 29px 20px 24px;

    }

    }

        font-size: 19px;
    }

}

   SMALL PHONE

@media (max-width: 360px) {

    .container {
        padding: 25px 17px 22px;

    h1 {

    }

}

   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation: none !important;

        transition: none !important;
    }

}

<body>

<div class="container">

    <div class="icon">
        🙇‍♂️
    </div>

    <h1>
        Em muốn nói với chị một chút...
    </h1>


    <div id="questionArea">

        <div
            class="question"
            id="question">
        </div>


        <div id="answerArea"></div>


        <div
            class="buttons"
            id="yesNoButtons">

            <button id="yesBtn">
                Có
            </button>

            <button id="noBtn">
                Không
            </button>

        </div>


        <button
            class="nextBtn hidden"
            id="nextBtn">

            Tiếp tục

        </button>


        <div
            class="error"
            id="error">
        </div>


        <div
            class="progress"
            id="progress">
        </div>


        <div class="small">
            Chị cứ trả lời thật lòng nhé.
        </div>

    </div>


    <div
        id="finalArea"
        class="final hidden">

        <h2>
            Cảm ơn chị đã trả lời.
        </h2>

        <p>
            Mong chị đừng vì một câu nói thiếu suy nghĩ
            của em mà cảm thấy không thoải mái.
        </p>

        <p>
            🙇‍♂️
        </p>

    </div>

</div>


<script>


/* =====================================================
   CÂU HỎI
===================================================== */

const questions = [

    {
        type: "single",

        question:
            "Chị còn thấy khó chịu về chuyện hôm qua không?",

        options: [
            "Không",
            "Còn một chút",
            "Còn nhiều lắm"
        ]
    },


    {
        type: "message",

        text: `
Hôm qua em có hơi vô duyên khi nhắc lại chuyện cũ lần 2 trong khi lần đầu chị đã phản ứng mạnh khi em nhắc đến điều đó.

Em tin chị không còn lụy anh đó và sẽ không nhắc lại chuyện đó nữa.

Em thật lòng xin lỗi chị. Xin lỗi chị nhiều lắmmm
        `
    },


    {
        type: "text",

        question:
            "Có điều gì chị muốn em giải thích thêm không?",

        placeholder:
            "Chị cứ nói thật nhé..."
    },


    {
        type: "yesno",

        question:
            "Chị tha thứ cho em nhaaa",

        yes:
            "Đồng ý",

        no:
            "Không đồng ý",

        dodge:
            true
    }

];


/* =====================================================
   BIẾN
===================================================== */

let currentQuestion = 0;

let answers = [];

let noClickCount = 0;


/* =====================================================
   ELEMENT
===================================================== */

const questionElement =
    document.getElementById("question");

const answerArea =
    document.getElementById("answerArea");

const yesNoButtons =
    document.getElementById("yesNoButtons");

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const nextBtn =
    document.getElementById("nextBtn");

const progress =
    document.getElementById("progress");

const error =
    document.getElementById("error");

const questionArea =
    document.getElementById("questionArea");

const finalArea =
    document.getElementById("finalArea");


/* =====================================================
   HIỂN THỊ CÂU HỎI
===================================================== */

function showQuestion() {

    const q =
        questions[currentQuestion];


    noClickCount = 0;


    questionElement.textContent =
        q.question || "";


    answerArea.innerHTML = "";


    error.textContent = "";


    yesNoButtons.classList.add("hidden");


    nextBtn.classList.add("hidden");


    noBtn.style.position = "static";

    noBtn.style.left = "auto";

    noBtn.style.top = "auto";


    if (q.type === "message") {

        progress.textContent = "";

    }
    else {

        progress.textContent =
            `Câu ${currentQuestion + 1} / ${questions.length}`;

    }


    /* =========================
       YES / NO
    ========================= */

    if (q.type === "yesno") {

        yesNoButtons.classList.remove("hidden");

        yesBtn.textContent = q.yes;

        noBtn.textContent = q.no;

        return;
    }


    /* =========================
       SINGLE
    ========================= */

    if (q.type === "single") {

        q.options.forEach(function(option) {

            const label =
                document.createElement("label");


            label.className = "option";


            label.innerHTML = `
                <input
                    type="radio"
                    name="singleAnswer"
                    value="${option}"
                >

                <span>
                    ${option}
                </span>
            `;


            answerArea.appendChild(label);

        });


        nextBtn.classList.remove("hidden");

        return;
    }


    /* =========================
       MULTIPLE
    ========================= */

    if (q.type === "multiple") {

        q.options.forEach(function(option) {

            const label =
                document.createElement("label");


            label.className = "option";


            label.innerHTML = `
                <input
                    type="checkbox"
                    value="${option}"
                >

                <span>
                    ${option}
                </span>
            `;


            answerArea.appendChild(label);

        });


        nextBtn.classList.remove("hidden");

        return;
    }


    /* =========================
       TEXT
    ========================= */

    if (q.type === "text") {

        const textarea =
            document.createElement("textarea");


        textarea.placeholder =
            q.placeholder;


        textarea.id =
            "textAnswer";


        answerArea.appendChild(textarea);


        nextBtn.classList.remove("hidden");

        return;
    }


    /* =========================
       MESSAGE
    ========================= */

    if (q.type === "message") {

        const message =
            document.createElement("div");


        message.className =
            "message";


        message.textContent =
            q.text;


        answerArea.appendChild(message);


        nextBtn.textContent =
            "Tiếp tục";


        nextBtn.classList.remove("hidden");

        return;
    }

}


/* =====================================================
   LƯU CÂU TRẢ LỜI
===================================================== */

function saveAnswer(answer) {

    const answerData = {
        questionNumber: currentQuestion + 1,
        question: questions[currentQuestion].question,
        answer: answer,
        noClicks: noClickCount
    };

    // Lưu tạm trong trình duyệt
    answers.push(answerData);

    // ⭐ Gửi NGAY câu này lên Google Sheets
    sendAnswerToGoogleSheet(answerData);
}

function sendAnswerToGoogleSheet(answerData) {

    if (
        GOOGLE_SCRIPT_URL ===
        "DÁN_URL_GOOGLE_APPS_SCRIPT_VÀO_ĐÂY"
    ) {
        console.log("Chưa cấu hình Google Sheets.");
        return;
    }

    fetch(GOOGLE_SCRIPT_URL, {

        method: "POST",

        mode: "no-cors",

        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify(answerData)

    });

}


/* =====================================================
   CÂU TIẾP THEO
===================================================== */

function goNext() {

    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        submitAnswers();

        return;
    }


    showQuestion();

}


/* =====================================================
   NÚT YES
===================================================== */

yesBtn.addEventListener(
    "click",
    function() {

        saveAnswer(
            yesBtn.textContent
        );

        goNext();

    }
);


/* =====================================================
   NÚT NO
===================================================== */

noBtn.addEventListener(
    "click",
    function() {

        const q =
            questions[currentQuestion];


        noClickCount++;


        if (q.dodge) {

            moveNoButton();

            return;
        }


        saveAnswer(
            noBtn.textContent
        );


        goNext();

    }
);


/* =====================================================
   NÚT TIẾP TỤC
===================================================== */

nextBtn.addEventListener(
    "click",
    function() {

        const q =
            questions[currentQuestion];


        /* =========================
           SINGLE
        ========================= */

        if (q.type === "single") {

            const selected =
                document.querySelector(
                    'input[name="singleAnswer"]:checked'
                );


            if (!selected) {

                error.textContent =
                    "Chị chọn một ý nhé.";

                return;
            }


            saveAnswer(
                selected.value
            );


            goNext();

            return;
        }


        /* =========================
           MULTIPLE
        ========================= */

        if (q.type === "multiple") {

            const checked =
                document.querySelectorAll(
                    '#answerArea input[type="checkbox"]:checked'
                );


            if (checked.length === 0) {

                error.textContent =
                    "Chị chọn ít nhất một ý nhé.";

                return;
            }


            const selected = [];


            checked.forEach(
                function(item) {

                    selected.push(
                        item.value
                    );

                }
            );


            saveAnswer(
                selected.join(", ")
            );


            goNext();

            return;
        }


        /* =========================
           TEXT
        ========================= */

        if (q.type === "text") {

            const textarea =
                document.getElementById(
                    "textAnswer"
                );


            const value =
                textarea.value.trim();


            if (value === "") {

                error.textContent =
                    "Chị viết cho em một chút nhé.";

                return;
            }


            saveAnswer(value);

            goNext();

            return;
        }


        /* =========================
           MESSAGE
        ========================= */

        if (q.type === "message") {

            goNext();

            return;
        }

    }
);


/* =====================================================
   NÚT NO CHẠY
===================================================== */

function moveNoButton() {

    noBtn.style.position =
        "fixed";


    const padding = 20;


    const maxX =
        window.innerWidth -
        noBtn.offsetWidth -
        padding;


    const maxY =
        window.innerHeight -
        noBtn.offsetHeight -
        padding;


    const x =
        padding +
        Math.random() *
        Math.max(
            0,
            maxX - padding
        );


    const y =
        padding +
        Math.random() *
        Math.max(
            0,
            maxY - padding
        );


    noBtn.style.left =
        `${x}px`;


    noBtn.style.top =
        `${y}px`;

}


/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyq524yWLVtPtdapM1gj6EW-6zI0O-Uy6NncdHVVwXDuBm4OfHaOwQanTdxxzl3_-Ja/exec";


/* =====================================================
   GỬI DỮ LIỆU
===================================================== */

function submitAnswers() {

    questionArea.classList.add("hidden");

    finalArea.classList.remove("hidden");

}


/* =====================================================
   BẮT ĐẦU
===================================================== */

showQuestion();

</script>

</body>
</html>
```
