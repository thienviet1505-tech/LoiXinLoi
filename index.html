```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Một chút muốn nói với chị</title>

<style>
* {
    box-sizing: border-box;

    .message {
    font-size: 17px;
    line-height: 1.7;
    color: #555;
    text-align: left;
    padding: 5px 5px 10px;
    white-space: pre-line;

    }
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f3eeee, #fffafa);
}

.container {
    width: 100%;
    max-width: 430px;
    padding: 28px 22px;
    background: white;
    border-radius: 24px;
    box-shadow: 0 8px 35px rgba(0, 0, 0, 0.12);
    text-align: center;
}

.icon {
    font-size: 65px;
    margin-bottom: 8px;
}

h1 {
    font-size: 23px;
    line-height: 1.4;
    color: #555;
    margin: 8px 0 20px;
}

.question {
    font-size: 20px;
    line-height: 1.55;
    color: #333;
    margin-bottom: 22px;
}

.option-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
}

.option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    cursor: pointer;
    background: #fafafa;
}

.option input {
    width: 18px;
    height: 18px;
}

.option:hover {
    background: #f3f3f3;
}

.buttons {
    position: relative;
    min-height: 55px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

button {
    border: none;
    border-radius: 13px;
    padding: 14px 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#yesBtn {
    background: #777;
    color: white;
}

#noBtn {
    background: #eee;
    color: #555;
}

#yesBtn:active,
#noBtn:active {
    transform: scale(0.95);
}

.nextBtn {
    background: #777;
    color: white;
    width: 100%;
    margin-top: 20px;
}

textarea {
    width: 100%;
    min-height: 130px;

    border: 1px solid #ddd;

    outline: none;
}

textarea:focus {
    border-color: #999;
}

.progress {
    margin-top: 20px;
    color: #aaa;
    font-size: 13px;
}

.small {
    margin-top: 8px;
    color: #aaa;
    font-size: 13px;
}

.hidden {
    display: none !important;
}

.final {
    font-size: 17px;
    line-height: 1.7;
    color: #444;
}

.final h2 {
    color: #555;
}

.error {
    color: #d9534f;
    font-size: 14px;
    margin-top: 10px;
}

@media (max-width: 360px) {

    .container {
        padding: 25px 18px;
    }

    .icon {
        font-size: 60px;
    }

    h1 {
        font-size: 21px;
    }

    .question {
        font-size: 18px;
    }

    button {
        min-width: 105px;
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- ================================================= -->
    <!-- ⭐ CÓ THỂ CHỈNH: ICON -->
    <!-- ================================================= -->

    <div class="icon">🙇‍♂️</div>


    <!-- ================================================= -->
    <!-- ⭐ CÓ THỂ CHỈNH: TIÊU ĐỀ -->
    <!-- ================================================= -->

    <h1>
        Em muốn nói với chị một chút...
    </h1>


    <!-- ================================================= -->
    <!-- KHU VỰC CÂU HỎI -->
    <!-- ================================================= -->

    <div id="questionArea">

        <div class="question" id="question"></div>

        <div id="answerArea"></div>

        <div class="buttons" id="yesNoButtons">
            <button id="yesBtn">Có</button>
            <button id="noBtn">Không</button>
        </div>

        <button class="nextBtn hidden" id="nextBtn">
            Tiếp tục
        </button>

        <div class="error" id="error"></div>

        <div class="progress" id="progress"></div>

        <div class="small">
            Chị cứ trả lời thật lòng nhé.
        </div>

    </div>


    <!-- ================================================= -->
    <!-- MÀN HÌNH CUỐI                                     -->
    <!-- ================================================= -->

    <div id="finalArea" class="final hidden">

        <h2>
            Cảm ơn chị đã trả lời.
        </h2>

        <p>
            Mong chị đừng vì một câu nói thiếu suy nghĩ
            của em mà cảm thấy không thoải mái.
        </p>

        <p>
            🙇‍♂️
        </p>

    </div>

</div>


<script>

// =====================================================
// ⭐⭐⭐ CHỈNH CÂU HỎI Ở ĐÂY ⭐⭐⭐
// =====================================================
//
// type:
// "yesno"     → YES / NO
// "single"    → chọn đúng 1 đáp án
// "multiple"  → chọn nhiều đáp án
// "text"      → tự nhập câu trả lời
//
// dodge:
// true  → nút NO chạy
// false → nút NO bình thường
//
// =====================================================

const questions = [


    // =================================================
    // CÂU 2: CHỌN 1 ĐÁP ÁN
    // =================================================

    {
        type: "single",

        // ⭐ CÓ THỂ CHỈNH CÂU HỎI
        question: "Chị còn thấy khó chịu về chuyện hôm qua không?",

        // ⭐ CÓ THỂ THÊM / XÓA ĐÁP ÁN
        options: [
            "Không",
            "Còn một chút",
            "Còn nhiều lắm"
        ]
    },


    {
        type: "message",

            text: `
        Hôm qua em có hơi vô duyên khi nhắc lại chuyện cũ lần 2 trong khi lần đầu chị đã phản ứng mạnh khi em nhắc đến điều đó.

        Em tin chị không còn lụy anh đó và sẽ không nhắc lại chuyện đó nữa.

        Em thật lòng xin lỗi chị. Xin lỗi chị nhiều lắmmm
            `
    },

    // =================================================
    // CÂU 3: CHỌN NHIỀU ĐÁP ÁN
    // =================================================

    // {
    //     type: "multiple",

    //     // ⭐ CÓ THỂ CHỈNH CÂU HỎI
    //     question: "Chị muốn em thay đổi điều gì?",

    //     // ⭐ CÓ THỂ THÊM / XÓA ĐÁP ÁN
    //     options: [
    //         "Suy nghĩ trước khi nói",
    //         "Không tự ý đánh giá người khác",
    //         "Bớt trêu quá đà",
    //         "Tinh tế hơn",
    //         "Biết xin lỗi đúng lúc"
    //     ]
    // },


    // =================================================
    // CÂU 4: TỰ ĐIỀN
    // =================================================

    {
        type: "text",

        // ⭐ CÓ THỂ CHỈNH CÂU HỎI
        question: "Có điều gì chị muốn em giải thích thêm không?",

        // ⭐ CÓ THỂ CHỈNH GỢI Ý
        placeholder: "Chị cứ nói thật nhé..."
    },


    

    // =================================================
    // CÂU 6: YES / NO
    // =================================================

    {
        type: "yesno",

        // ⭐ CÓ THỂ CHỈNH CÂU HỎI
        question: "Chị tha thứ cho em nhaaa",

        // ⭐ CÓ THỂ CHỈNH 2 NÚT
        yes: "Đồng ý",
        no: "Không đồng ý",

        // ⭐ true = NO chạy
        dodge: true
    }

];


// =====================================================
// ⭐ KHÔNG CẦN CHỈNH PHẦN BÊN DƯỚI
// =====================================================

let currentQuestion = 0;

let answers = [];

// ⭐ ĐẾM SỐ LẦN BẤM NO CỦA CÂU HIỆN TẠI
let noClickCount = 0;


const questionElement =
    document.getElementById("question");

const answerArea =
    document.getElementById("answerArea");

const yesNoButtons =
    document.getElementById("yesNoButtons");

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const nextBtn =
    document.getElementById("nextBtn");

const progress =
    document.getElementById("progress");

const error =
    document.getElementById("error");

const questionArea =
    document.getElementById("questionArea");

const finalArea =
    document.getElementById("finalArea");


// =====================================================
// HIỂN THỊ CÂU HỎI
// =====================================================

function showQuestion() {

    const q = questions[currentQuestion];

    // ⭐ Sang câu mới → reset số lần NO
    noClickCount = 0;

    questionElement.textContent = q.question;

    answerArea.innerHTML = "";

    error.textContent = "";

    yesNoButtons.classList.add("hidden");

    nextBtn.classList.add("hidden");

    noBtn.style.position = "static";
    noBtn.style.left = "auto";
    noBtn.style.top = "auto";

    if (q.type === "message") {

        progress.textContent = "";

    } else {

        progress.textContent =
            `Câu ${currentQuestion + 1} / ${questions.length}`;

    }

    // =================================================
    // YES / NO
    // =================================================

    if (q.type === "yesno") {

        yesNoButtons.classList.remove("hidden");

        yesBtn.textContent = q.yes;
        noBtn.textContent = q.no;

        return;
    }


    // =================================================
    // CHỌN 1 ĐÁP ÁN
    // =================================================

    if (q.type === "single") {

        q.options.forEach(function(option) {

            const label =
                document.createElement("label");

            label.className = "option";

            label.innerHTML = `
                <input
                    type="radio"
                    name="singleAnswer"
                    value="${option}">
                <span>${option}</span>
            `;

            answerArea.appendChild(label);

        });

        nextBtn.classList.remove("hidden");

        return;
    }


    // =================================================
    // CHỌN NHIỀU ĐÁP ÁN
    // =================================================

    if (q.type === "multiple") {

        q.options.forEach(function(option) {

            const label =
                document.createElement("label");

            label.className = "option";

            label.innerHTML = `
                <input
                    type="checkbox"
                    value="${option}">
                <span>${option}</span>
            `;

            answerArea.appendChild(label);

        });

        nextBtn.classList.remove("hidden");

        return;
    }


    // =================================================
    // TỰ ĐIỀN
    // =================================================

    if (q.type === "text") {

        const textarea =
            document.createElement("textarea");

        textarea.placeholder = q.placeholder;

        textarea.id = "textAnswer";

        answerArea.appendChild(textarea);

        nextBtn.classList.remove("hidden");

    }

    if (q.type === "message") {

        const message =
            document.createElement("div");

        message.className = "message";

        message.textContent = q.text;

        answerArea.appendChild(message);

        nextBtn.textContent = "Tiếp tục";

        nextBtn.classList.remove("hidden");

        return;
    }

}


// =====================================================
// LƯU CÂU TRẢ LỜI
// =====================================================

function saveAnswer(answer) {

    answers.push({

        question:
            questions[currentQuestion].question,

        answer: answer,

        // ⭐ LƯU SỐ LẦN BẤM NO
        noClicks: noClickCount

    });

}


// =====================================================
// SANG CÂU TIẾP THEO
// =====================================================

function goNext() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        submitAnswers();

        return;
    }

    showQuestion();

}


// =====================================================
// NÚT YES
// =====================================================

yesBtn.addEventListener("click", function() {

    saveAnswer(yesBtn.textContent);

    goNext();

});


// =====================================================
// NÚT NO
// =====================================================

noBtn.addEventListener("click", function() {

    const q = questions[currentQuestion];

    // ⭐ Mỗi lần bấm NO tăng 1
    noClickCount++;


    if (q.dodge) {

        moveNoButton();

        return;
    }


    saveAnswer(noBtn.textContent);

    goNext();

});


// =====================================================
// NÚT TIẾP TỤC
// =====================================================

nextBtn.addEventListener("click", function() {

    const q = questions[currentQuestion];


    // =================================================
    // CHỌN 1
    // =================================================

    if (q.type === "single") {

        const selected =
            document.querySelector(
                'input[name="singleAnswer"]:checked'
            );


        if (!selected) {

            error.textContent =
                "Chị chọn một ý nhé.";

            return;
        }


        saveAnswer(selected.value);

        goNext();

        return;
    }


    // =================================================
    // CHỌN NHIỀU
    // =================================================

    if (q.type === "multiple") {

        const checked =
            document.querySelectorAll(
                '#answerArea input[type="checkbox"]:checked'
            );


        if (checked.length === 0) {

            error.textContent =
                "Chị chọn ít nhất một ý nhé.";

            return;
        }


        const selected = [];


        checked.forEach(function(item) {

            selected.push(item.value);

        });


        saveAnswer(selected.join(", "));

        goNext();

        return;
    }


    // =================================================
    // TỰ ĐIỀN
    // =================================================

    if (q.type === "text") {

        const textarea =
            document.getElementById("textAnswer");


        const value =
            textarea.value.trim();


        if (value === "") {

            error.textContent =
                "Chị viết cho em một chút nhé.";

            return;
        }


        saveAnswer(value);

        goNext();

    }

    if (q.type === "message") {

        goNext();

        return;
    }

});


// =====================================================
// NÚT NO CHẠY
// =====================================================

function moveNoButton() {

    noBtn.style.position = "fixed";

    const padding = 20;


    const maxX =
        window.innerWidth -
        noBtn.offsetWidth -
        padding;


    const maxY =
        window.innerHeight -
        noBtn.offsetHeight -
        padding;


    const x =
        padding +
        Math.random() *
        Math.max(0, maxX - padding);


    const y =
        padding +
        Math.random() *
        Math.max(0, maxY - padding);


    noBtn.style.left = `${x}px`;

    noBtn.style.top = `${y}px`;

}


// =====================================================
// ⭐ GOOGLE APPS SCRIPT URL
// =====================================================
//
// ⭐ GIỮ NGUYÊN URL CỦA BẠN Ở ĐÂY
//
// =====================================================

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxZMQTaYFYnpkxeNBzAMseCx5trjeKM_Pk4f7jt2Oxk0AJ4APRoRMUoXiBTARAMNBN_/exec";


// =====================================================
// GỬI DỮ LIỆU
// =====================================================

function submitAnswers() {

    questionArea.classList.add("hidden");

    finalArea.classList.remove("hidden");


    if (
        GOOGLE_SCRIPT_URL ===
        "DÁN_URL_GOOGLE_APPS_SCRIPT_VÀO_ĐÂY"
    ) {

        console.log(
            "Chưa cấu hình Google Sheets."
        );

        return;
    }


    fetch(GOOGLE_SCRIPT_URL, {

        method: "POST",

        mode: "no-cors",

        headers: {
            "Content-Type":
                "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

            answers: answers

        })

    });

}


// =====================================================
// BẮT ĐẦU
// =====================================================

showQuestion();

</script>

</body>
</html>
```
